[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-yuanli-mcp"
version = "0.1.0"
description = "Local MCP server for direct Heartbeat Yuanli DokiDoki BLE control"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Heartbeat Yuanli MCP contributors"}
]
dependencies = [
  "bleak>=3,<4",
  "mcp>=2,<3",
]

[project.scripts]
heartbeat-yuanli-mcp = "heartbeat_yuanli_mcp.server:main"

[tool.setuptools.packages.find]
include = ["heartbeat_yuanli_mcp*"]
